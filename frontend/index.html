<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080A0E" />
  <link rel="icon" type="image/png" href="/images/esu.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  
  <!-- Immediate Theme Initializer: prevents flash of unstyled theme on load -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio_theme');
        var isDark = saved ? saved === 'dark' : true;
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.add('light');
          root.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- Performance Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <link rel="dns-prefetch" href="https://portfolio-backend-gxhv.onrender.com" />
  <link rel="preload" as="image" href="/images/esu.png" />

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <title>Esubalew Molla | Full Stack Developer</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
