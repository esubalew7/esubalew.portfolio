<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#141c28"/>
    </linearGradient>
    <linearGradient id="metaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0081FB"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(0, 129, 251, 0.3)" stroke-width="1.5" rx="6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" rx="4"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="6" fill="url(#metaBlue)" rx="3"/>

  <!-- Meta Header -->
  <g transform="translate(60, 70)">
    <!-- Meta Infinity Logo Representation -->
    <path d="M40,24 C40,14 31,6 20,6 C9,6 0,14 0,24 C0,34 9,42 20,42 C28,42 34,36 40,28 C46,36 52,42 60,42 C71,42 80,34 80,24 C80,14 71,6 60,6 C49,6 40,14 40,24 Z" fill="none" stroke="#0081FB" stroke-width="7"/>
    <text x="96" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Meta</text>
    <text x="96" y="48" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#0081FB" letter-spacing="0.16em" text-transform="uppercase">Professional Certificate</text>
  </g>

  <!-- Certificate Body -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="0.14em" text-transform="uppercase">This is to certify that</text>
    <text x="0" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Esubalew Molla</text>
    <text x="0" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">has successfully completed the professional curriculum for</text>
    <text x="0" y="112" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="800" fill="#0081FB" letter-spacing="-0.01em">Meta Front-End Developer</text>
    <text x="0" y="142" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255,255,255,0.5)">React · Advanced JavaScript · HTML5/CSS3 · UI/UX Design · Git</text>
  </g>

  <!-- Footer Seal & Verification -->
  <g transform="translate(60, 395)">
    <!-- Verified Badge -->
    <circle cx="30" cy="30" r="28" fill="rgba(0, 129, 251, 0.12)" stroke="#0081FB" stroke-width="1.5"/>
    <path d="M22,30 L28,36 L39,23" fill="none" stroke="#0081FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.08em">VERIFIED CREDENTIAL</text>
    <text x="75" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">Issued: 2024 · ID: META-FE-2024-8849</text>
  </g>

  <!-- Signature line -->
  <g transform="translate(560, 415)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="90" y="20" font-family="'Space Grotesk', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">Meta Staff Instructor</text>
  </g>
</svg>
