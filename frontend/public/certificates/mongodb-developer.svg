<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b140d"/>
      <stop offset="100%" stop-color="#112216"/>
    </linearGradient>
    <linearGradient id="mongoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ED64"/>
      <stop offset="100%" stop-color="#00684A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" rx="8"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(0, 237, 100, 0.25)" stroke-width="1.5" rx="6"/>
  <rect x="28" y="28" width="744" height="444" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" rx="4"/>

  <!-- Top Accent Bar -->
  <rect x="20" y="20" width="760" height="6" fill="url(#mongoGreen)" rx="3"/>

  <!-- MongoDB Header -->
  <g transform="translate(60, 65)">
    <!-- MongoDB Leaf Logo -->
    <path d="M25,2 C25,2 45,18 45,36 C45,50 34,60 25,66 C16,60 5,50 5,36 C5,18 25,2 25,2 Z" fill="none" stroke="#00ED64" stroke-width="4"/>
    <path d="M25,12 L25,58" stroke="#00ED64" stroke-width="2.5"/>
    <text x="65" y="34" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">MongoDB</text>
    <text x="65" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#00ED64" letter-spacing="0.16em" text-transform="uppercase">University Certification</text>
  </g>

  <!-- Certificate Body -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="0.14em" text-transform="uppercase">This is to certify that</text>
    <text x="0" y="40" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">Esubalew Molla</text>
    <text x="0" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.7)">has successfully completed the developer path for</text>
    <text x="0" y="112" font-family="'Space Grotesk', system-ui, sans-serif" font-size="26" font-weight="800" fill="#00ED64" letter-spacing="-0.01em">MongoDB Node.js Developer Path</text>
    <text x="0" y="142" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255,255,255,0.5)">Aggregation Framework · Data Modeling · Indexing &amp; Optimization · Mongoose</text>
  </g>

  <!-- Footer Seal & Verification -->
  <g transform="translate(60, 395)">
    <!-- Verified Badge -->
    <circle cx="30" cy="30" r="28" fill="rgba(0, 237, 100, 0.1)" stroke="#00ED64" stroke-width="1.5"/>
    <path d="M22,30 L28,36 L39,23" fill="none" stroke="#00ED64" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.08em">ACCREDITED CREDENTIAL</text>
    <text x="75" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">Issued: 2024 · ID: MDB-NODE-2024-4192</text>
  </g>

  <!-- Signature line -->
  <g transform="translate(560, 415)">
    <line x1="0" y1="0" x2="180" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="90" y="20" font-family="'Space Grotesk', sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="middle">MongoDB Education Dean</text>
  </g>
</svg>
